

#  1. pyrender配置
# fast_scene专用配置, 在 fast_scene_bpy 中没有用到
floor_texture_path: /data-nas/data/experiments/mushui/projects/utils/fast-scene/assets/textures/floor_texture2.png
ceiling_texture_path: /data-nas/data/experiments/mushui/projects/utils/fast-scene/assets/textures/wall_texture3.png
wall_texture_path: /data-nas/data/experiments/mushui/projects/utils/fast-scene/assets/textures/wall_texture3.png
door_texture_path: /data-nas/data/experiments/mushui/projects/utils/fast-scene/assets/textures/door.png
window_texture_path: /data-nas/data/experiments/mushui/projects/utils/fast-scene/assets/textures/window.png
wall_color:  # 墙体颜色, 在 fast_scene_bpy 中为材质不存在下的备选
- 1.2
- 1.2
- 1.2
- 1.0
wall_edge_enabled: true  # 是否显示墙体边缘线条让墙体看起来更明显
wall_edge_color:  # 边缘线条颜色 [R, G, B, A]
- 0.1
- 0.1
- 0.1
- 1.0
wall_edge_offset: 0.01  # 边缘线向房间内部偏移距离（米），避免相邻墙边缘重叠  
    
    
# 2. fast_scene_bpy中使用的配置
floor_blender_texture_path: /data-nas/data/experiments/mushui/projects/utils/fast-scene/assets/textures/oak_veneer_01_1k.blend/oak_veneer_01_1k.blend
ceiling_blender_texture_path: /data-nas/data/experiments/mushui/projects/utils/fast-scene/assets/textures/polystyrene_1k.blend/polystyrene_1k.blend
wall_blender_texture_path: /data-nas/data/experiments/mushui/projects/utils/fast-scene/assets/textures/polystyrene_1k.blend/polystyrene_1k.blend
hdri_path: /data-nas/data/experiments/mushui/projects/utils/fast-scene/assets/HDRIs/qwantani_sunset_puresky_1k.exr


model_path: /data-nas/data/dataset/qunhe/Manycore-Future/models # 原家具模型路径
model_simplified_path: /data-nas/data/dataset/qunhe/Manycore-Future/simplified # 简化家具模型路径
model_generate_path: /data-nas/data/dataset/qunhe/Manycore-Future/generate # 生成家具模型路径
model_hole_path: /data-nas/data/dataset/qunhe/Manycore-Future/holes # 门窗模型路径

# 渲染配置
array_light_intensity: 8.0 # array 模式下每盏灯的强度
blender_samples: 32 # Blender 渲染采样数



# 3. 通用配置
wall_thickness: 0.2 # 墙体厚度
wall_texture_scale: 0.25     # 墙体纹理缩放系数 (1m内重复次数)
floor_texture_scale: 0.25    # 地板纹理缩放系数
ceiling_texture_scale: 0.5  # 天花板纹理缩放系数
indoor_fov: 90  # 相机在房间内时的固定FOV（度）
outdoor_fov_scale: 1.1  # 相机在房间外时FOV的缩放系数




