

#  1. pyrender config
# scenebuilder-specific settings (not used in scenebuilder_bpy)
# Asset paths are relative to scenebuilder package root (same level as config.yaml)
floor_texture_path: assets/textures/floor_texture2.png
ceiling_texture_path: assets/textures/wall_texture3.png
wall_texture_path: assets/textures/wall_texture3.png
door_texture_path: assets/textures/door.png
window_texture_path: assets/textures/window.png
wall_color:  # Wall color; fallback in scenebuilder_bpy when material is missing
- 1.2
- 1.2
- 1.2
- 1.0
wall_edge_enabled: true  # Show wall edge lines for clearer wall appearance
wall_edge_color:  # Edge line color [R, G, B, A]
- 0.1
- 0.1
- 0.1
- 1.0
wall_edge_offset: 0.01  # Edge line inset toward room interior (m), avoids overlapping adjacent wall edges  
    
    
# 2. Config used in scenebuilder_bpy
floor_blender_texture_path: assets/textures/oak_veneer_01_1k.blend/oak_veneer_01_1k.blend
ceiling_blender_texture_path: assets/textures/polystyrene_1k.blend/polystyrene_1k.blend
wall_blender_texture_path: assets/textures/polystyrene_1k.blend/polystyrene_1k.blend
hdri_path: assets/HDRIs/qwantani_sunset_puresky_1k.exr


model_path: /data-nas/data/dataset/qunhe/Manycore-Future/models # Original furniture model path
model_simplified_path: /data-nas/data/dataset/qunhe/Manycore-Future/simplified # Simplified furniture model path
model_generate_path: /data-nas/data/dataset/qunhe/Manycore-Future/generate # Generated furniture model path
model_hole_path: /data-nas/data/dataset/qunhe/Manycore-Future/holes # Door/window model path

# Render settings
array_light_intensity: 20.0 # Light intensity per lamp in array mode
blender_samples: 32 # Blender render sample count



# 3. Shared config
wall_thickness: 0.2 # Wall thickness
wall_texture_scale: 0.5       # Wall texture: ~2m per repeat (~5px/cm @ 1K)
floor_texture_scale: 0.25    # Floor texture scale factor
ceiling_texture_scale: 0.5  # Ceiling texture scale factor
indoor_fov: 90  # Fixed FOV (degrees) when camera is inside room
outdoor_fov_scale: 1.1  # FOV scale factor when camera is outside room

# 4. Normalized top-down floor path (depth nav mask)
nav_mask_depth_tolerance_m: 0.05  # Walkable depth: camera-to-ground distance ± this value (m)
nav_mask_inset_m: 0.15           # Inset from outer boundary (m)
nav_mask_point_spacing_m: 0.3    # Sample spacing along inner boundary (m)
topdown_occluder_bottom_margin_m: 0.25       # Skip bbox near ceiling (top/bottom vs wall_height - margin)
topdown_occluder_min_floor_area_ratio: 0.10  # ...and XY footprint >= floor_area * this
topdown_occluder_keyword_min_floor_area_ratio: 0.05  # Softer threshold when label hints ceiling
topdown_occluder_large_footprint_ratio: 0.25  # Also skip if top near ceiling and XY >= floor * this

# 5. Visible geometry mask criteria
ratio_if_visible: 0.1             # visible mask / overall mask below this → mostly_occluded
min_overall_pixels: 16            # overall mask pixels below this skip visibility ratio and geometry export

# 6. Bbox point-cloud sampling (volume-tiered; min/mid = 10%/50% of max)
box_point_samples_max: 5000       # >=1m³ bbox; 0.125-1m³ → 50%-100%; <0.125m³ → 10%-50%
samples_per_object: 5000          # Non-bbox objects (walls, floor, doors, ...)

